name: PR QA Gates

# Her pull request'te çalışır: typecheck, lint, unit, temel Playwright E2E, web build.
# (AI regresyon + Maestro secret gerektirdiği için VPS cron'unda / ayrı workflow'ta çalışır.)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'

permissions:
  contents: read

concurrency:
  group: pr-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run baseline Playwright E2E (no credentials)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
        run: |
          NODE_ENV=production PORT=3100 node dist/server.mjs &
          sleep 2
          npx playwright test e2e --project=desktop-chromium --grep "yeni kullanıcı oluşturma formu yok|boş alanlarla giriş butonu pasiftir|yeni kullanıcı oluşturma" --reporter=line
          kill %1 || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
