name: Build Signed Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/lingua-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD secret is missing'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS secret is missing'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD secret is missing'; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build web app for Android
        env:
          CAPACITOR_BUILD: 'true'
        run: npm run build

      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Restore persistent signing keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Configure Android package, version and release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest_text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in manifest_text:
              manifest_text = manifest_text.replace('<application', permission + '\n    <application', 1)
              manifest.write_text(manifest_text, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')

          text, version_code_count = re.subn(
              r'(?m)^\s*versionCode\s+\d+\s*$',
              f'        versionCode {int(os.environ["VERSION_CODE"])}',
              text,
              count=1,
          )
          text, version_name_count = re.subn(
              r'(?m)^\s*versionName\s+["\'][^"\']+["\']\s*$',
              f'        versionName "{os.environ["VERSION_NAME"]}"',
              text,
              count=1,
          )
          if version_code_count != 1 or version_name_count != 1:
              raise SystemExit('Could not update Android versionCode/versionName')

          signing_block = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          '''
          if 'storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))' not in text:
              marker = '    buildTypes {'
              if marker not in text:
                  raise SystemExit('Could not locate Android buildTypes block')
              text = text.replace(marker, signing_block + marker, 1)

          if 'signingConfig signingConfigs.release' not in text:
              text, count = re.subn(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit('Could not configure release signing')

          gradle.write_text(text, encoding='utf-8')
          PY

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          APK_NAME="Lingua-Production-Coach-${VERSION_NAME}.apk"
          test -f "$APK_SOURCE"
          cp "$APK_SOURCE" "$APK_NAME"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee APK-SIGNATURE.txt
          sha256sum "$APK_NAME" | tee SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Production-Coach-signed-APK
          path: |
            Lingua-Production-Coach-${{ env.VERSION_NAME }}.apk
            APK-SIGNATURE.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK as a GitHub Release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-build-${{ github.run_number }}"
          gh release create "$TAG" \
            "Lingua-Production-Coach-${VERSION_NAME}.apk" \
            APK-SIGNATURE.txt \
            SHA256SUMS.txt \
            --title "Lingua Production Coach – Android ${VERSION_NAME}" \
            --notes "Kalıcı anahtarla imzalanmış güncellenebilir Android APK. İlk kalıcı imzalı sürüm için eski debug kurulumu bir kez kaldırılmalıdır; bundan sonraki sürümler uygulama verileri silinmeden üzerine kurulabilir." \
            --target "${{ github.sha }}"
