name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build web app for Android
        env:
          CAPACITOR_BUILD: 'true'
        run: npm run build

      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add Android microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in text:
              text = text.replace('<application', permission + '\n    <application', 1)
              manifest.write_text(text)
          PY

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lingua-Production-Coach-debug.apk

      - name: Print APK checksum
        run: sha256sum Lingua-Production-Coach-debug.apk

      - name: Upload APK (zipped workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Production-Coach-APK
          path: Lingua-Production-Coach-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as a GitHub Release asset (unzipped, direct download)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-build-${{ github.run_number }}"
          gh release create "$TAG" \
            Lingua-Production-Coach-debug.apk \
            --title "Lingua Production Coach – Android debug APK (build ${{ github.run_number }})" \
            --notes "Otomatik oluşturulan debug APK. Bu dosyayı doğrudan indirip kurabilirsin, zip açmaya gerek yok." \
            --target "${{ github.sha }}"
